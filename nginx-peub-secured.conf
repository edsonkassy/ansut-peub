# Configuration Nginx sécurisée pour PEUB
# À déployer sur le serveur de production

server {
    server_name peub.ansut.ci www.peub.ansut.ci;
    
    root /var/www/ansut-peub/public;
    index index.php index.html index.htm;
    
    # Headers de sécurité HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.openai.com https://*.openai.azure.com; frame-ancestors 'self';" always;
    
    # Upload size réduit (sécurité)
    client_max_body_size 20M;
    
    # Cache headers pour les assets statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Blocage de l'accès aux fichiers sensibles
    location ~ /\.(env|git|log) {
        deny all;
        return 404;
    }
    
    # Laravel configuration
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }
    
    error_page 404 /index.php;
    
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    
    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/peub.ansut.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peub.ansut.ci/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.peub.ansut.ci) {
        return 301 https://$host$request_uri;
    }

    if ($host = peub.ansut.ci) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name peub.ansut.ci www.peub.ansut.ci;
    return 404;
}

