name: Déploiement recette PEUB

# Le serveur de recette (Peub-rec-web-01) sert /var/www/ansut-peub sur la branche develop.
# Les migrations NE sont PAS lancées ici : elles restent manuelles (voir docs/DEPLOIEMENT_PALMARES.md).

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-recette
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /var/www/ansut-peub
            git checkout develop
            # --ff-only : échoue au lieu d'écraser des modifications faites à la main sur le serveur
            git pull --ff-only origin develop
            composer install --no-dev --no-interaction --optimize-autoloader
            php artisan config:cache
            php artisan view:cache
            php artisan route:cache
            echo "Déployé : $(git log -1 --format='%h %s')"
